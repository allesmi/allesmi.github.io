{{ define "main" }}
<content>
    {{ if .Title }}
    <h1>{{ .Title }}</h1>
    {{ end }}
    
    {{ .Content }}

    {{ range .Pages.GroupByDate "2006" }}
    <h3>{{ .Key }}</h3>
    <ul>
        {{ range .Pages }}
        <li><a href="{{ .Permalink }}">{{ .Title }} ({{ .Date.Format "02 Jan 2006" }})</a></li>
        {{ end }}
    </ul>
    
    {{ end }}
    
</content>
{{ end }}
