name: Gh-Pages

on: push

jobs:
  gh-pages:
    name: Build GH pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          submodules: true
          fetch-depth: 0
      
      - name: Setup hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.75.1'
      
      - name: Build
        run: hugo --minify
